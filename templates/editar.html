<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark fw-bold">Editar Producto</div>
            <div class="card-body">
                <form action="/editar/{{ producto.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Código</label>
                        <input type="text" name="codigo" value="{{ producto.codigo }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" value="{{ producto.nombre }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" name="cantidad" value="{{ producto.cantidad }}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Actualizar Cambios</button>
                    <a href="/" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
